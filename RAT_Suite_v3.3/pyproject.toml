[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hpms-rat-suite"
version = "3.3.0"
description = "Federal Highway Administration (FHWA) HPMS Roadway Alignment Tool (RAT) Suite."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC0 1.0 Universal"}
authors = [
  {name = "Federal Highway Administration (FHWA)"}
]
dependencies = [
    "numpy",
    "pandas",
    "geopandas",
    "shapely",
    "fiona",
    "scipy",
    "rasterio",
    "pyproj",
    "folium",
    "matplotlib",
    "plotly",
    "contextily",
    "requests",
    "laspy[lazrs]",
    "Pillow",
]

# The suite runs from its own folder (python apps/rat_unified_gui.py), so
# "pip install ." installs only the dependencies above and no packages.
[tool.setuptools]
packages = []
